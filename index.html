<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Угадай FOB-цену — Миллионер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#050c24;
    --bg-mid:#0b1a44;
    --stage-1:#0d2266;
    --stage-2:#122c7a;
    --cyan:#33d6d6;
    --cyan-dim:#1b6b73;
    --gold:#ffc61a;
    --gold-dim:#8a6a12;
    --pink:#e8407a;
    --green:#3fbf4f;
    --red:#e14848;
    --text:#f4f7ff;
    --text-dim:#9db3e0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 1000px 500px at 50% 0%, #14306f 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-mid) 0%, var(--bg-deep) 100%);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
  }
  .wrap{ width:100%; margin:0; padding:0; }

  /* ============ STAGE FRAME ============ */
  .stage{
    position:relative;
    overflow:hidden;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 4px),
      radial-gradient(circle at 50% 8%, var(--stage-2) 0%, var(--stage-1) 45%, #071238 100%);
    padding:22px clamp(16px,4vw,60px) 0;
    min-height:100vh;
    width:100%;
    display:flex;
    flex-direction:column;
  }
  /* rotating rays behind everything */
  .stage::before{
    content:"";
    position:absolute; top:38%; left:50%;
    width:1600px; height:1600px; margin:-800px 0 0 -800px;
    background:repeating-conic-gradient(from 0deg, rgba(120,180,255,0.07) 0deg 2deg, transparent 2deg 16deg);
    animation:spin 50s linear infinite;
    pointer-events:none;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* audience silhouette strip at very bottom */
  .audience-strip{
    position:absolute; left:0; right:0; bottom:0; height:34px;
    background:
      radial-gradient(circle at 5% 100%, #061033 0 10px, transparent 11px) repeat-x,
      radial-gradient(circle at 15% 100%, #061033 0 12px, transparent 13px) repeat-x;
    background-size:40px 34px, 60px 34px;
    opacity:0.8;
  }

  .content{ position:relative; z-index:2; max-width:1300px; margin:0 auto; width:100%; flex:1; display:flex; flex-direction:column; justify-content:center; padding-bottom:40px; }

  /* ============ TOP ICON BAR ============ */
  .iconbar{ display:flex; justify-content:space-between; align-items:flex-start; padding:2px 2px 6px; }
  .icon-group{ display:flex; gap:10px; }
  .icon-btn{
    width:44px; height:44px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #163a8c, #081848);
    border:2px solid var(--cyan);
    color:var(--text);
    display:flex; align-items:center; justify-content:center;
    font-size:16px; cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,0.35);
    transition:transform .12s ease;
  }
  .icon-btn:hover:not(:disabled){ transform:translateY(-2px); }
  .icon-btn:disabled{ opacity:0.3; cursor:not-allowed; }
  .icon-btn.small{ width:38px; height:38px; font-size:12px; font-family:'Oswald',sans-serif; font-weight:600; }

  /* ============ HOST + LOGO BADGE ============ */
  .host-row{
    display:flex; align-items:flex-end; justify-content:center;
    gap:18px; position:relative;
    min-height:150px;
    margin-bottom:6px;
  }
  .host-wrap{ position:relative; flex:none; display:flex; align-items:flex-start; gap:10px; }
  .badge{
    position:relative; top:14px;
    width:64px; height:52px; border-radius:10px;
    background:radial-gradient(circle at 40% 30%, #3a1560, #170733);
    border:3px solid var(--gold);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Oswald',sans-serif; z-index:3; flex:none;
    box-shadow:0 0 18px rgba(255,198,26,0.3);
  }
  .badge .q-n{ color:var(--gold); font-weight:700; font-size:19px; line-height:1; }
  .badge .q-l{ color:var(--text-dim); font-size:8px; letter-spacing:0.06em; margin-top:1px; }

  .host{ width:150px; height:190px; flex:none; position:relative; }
  .speech{
    background:#fff; color:#1a1a2e;
    border-radius:16px; padding:12px 16px;
    font-size:14px; font-weight:600;
    max-width:250px; position:relative;
    margin-bottom:36px; margin-left:6px;
    min-height:20px;
    display:flex; align-items:center;
    opacity:0; transform:translateX(-8px);
    transition:opacity .25s ease, transform .25s ease;
  }
  .speech.show{ opacity:1; transform:translateX(0); }
  .speech::before{
    content:"";
    position:absolute; left:-16px; bottom:16px;
    border:9px solid transparent; border-right-color:#fff;
  }

  /* ============ MAIN 3-COL LAYOUT ============ */
  .main-grid{
    display:grid;
    grid-template-columns:170px 1fr 190px;
    gap:14px;
    align-items:start;
  }
  @media (max-width:820px){
    .main-grid{ grid-template-columns:1fr; }
    .side-left{ order:3; }
    .side-right{ order:2; }
  }

  /* ---- left: winnings box ---- */
  .win-box{
    background:linear-gradient(180deg, #0e2a6e, #081638);
    border:2px solid var(--cyan);
    border-radius:12px;
    padding:12px 10px;
    text-align:center;
  }
  .win-box .lbl{ font-size:11.5px; color:var(--text-dim); margin-bottom:4px; }
  .win-box .amt{ font-family:'Oswald',sans-serif; color:var(--gold); font-size:19px; font-weight:600; margin-bottom:10px; }
  .cashout-btn{
    background:var(--cyan); color:#04211f; border:none;
    font-family:'Oswald',sans-serif; font-weight:600; font-size:13px;
    padding:9px 6px; border-radius:8px; width:100%; cursor:pointer;
    box-shadow:0 3px 0 var(--cyan-dim);
  }
  .cashout-btn:hover{ filter:brightness(1.08); }
  .cashout-btn:disabled{ opacity:0.35; cursor:not-allowed; }

  /* ---- center: shirt + facts + question + options ---- */
  .shirt-box{
    background:radial-gradient(ellipse at 50% 30%, rgba(120,170,255,0.14), transparent 70%);
    border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    height:min(30vh, 300px);
    position:relative;
    margin-bottom:8px;
  }
  .shirt-box img{ height:100%; width:auto; max-width:100%; object-fit:contain; border-radius:10px; filter:drop-shadow(0 10px 18px rgba(0,0,0,0.45)); background:#fff; padding:6px; }

  .facts{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .fact{
    font-size:11.5px; color:var(--text-dim);
    background:rgba(255,255,255,0.05); border:1px solid rgba(120,170,255,0.3);
    border-radius:100px; padding:4px 10px;
  }
  .fact b{ color:var(--text); }

  .q-hex{
    background:linear-gradient(180deg,#123a8f,#0a2360);
    border:2px solid var(--cyan);
    clip-path:polygon(2% 0,98% 0,100% 50%,98% 100%,2% 100%,0 50%);
    padding:12px 30px;
    text-align:center;
    font-size:14.5px;
    font-weight:600;
    margin-bottom:10px;
  }

  .options{ display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; }
  @media (max-width:520px){ .options{ grid-template-columns:1fr; } }
  .opt{
    background:linear-gradient(180deg,#0e2a6e,#081848);
    border:2px solid var(--cyan);
    clip-path:polygon(3% 0,97% 0,100% 50%,97% 100%,3% 100%,0 50%);
    padding:10px 18px;
    font-size:13.5px; font-weight:600;
    color:var(--text);
    cursor:pointer;
    text-align:left;
    transition:background .15s ease, border-color .15s ease;
  }
  .opt:hover:not(:disabled){ background:linear-gradient(180deg,#173a8f,#0c2560); }
  .opt:disabled{ cursor:default; }
  .opt.removed{ visibility:hidden; }
  .opt b{ color:var(--gold); margin-right:4px; }
  .opt.selected{ border-color:var(--gold); background:linear-gradient(180deg,#4a3a10,#2a2308); }
  .opt.correct{ border-color:var(--green); background:linear-gradient(180deg,#1c6b2c,#0e3a18); }
  .opt.wrong{ border-color:var(--red); background:linear-gradient(180deg,#7a1f1f,#3a0d0d); }

  .footer-row{ display:flex; justify-content:center; margin:12px 0 10px; }

  .q-hex-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .q-hex-row .q-hex{ flex:1; margin-bottom:0; }
  .timer-wrap{
    flex:none; width:46px; height:46px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #163a8c, #081848);
    border:2.5px solid var(--cyan);
    display:flex; align-items:center; justify-content:center;
    transition:border-color .3s ease, box-shadow .3s ease;
  }
  .timer-wrap .timer-num{ font-family:'Oswald',sans-serif; font-weight:700; font-size:18px; color:var(--cyan); }
  .timer-wrap.low{ border-color:var(--red); box-shadow:0 0 14px rgba(225,72,72,0.6); animation:timerPulse .6s ease-in-out infinite; }
  .timer-wrap.low .timer-num{ color:var(--red); }
  @keyframes timerPulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.12); } }

  .calc-throw{
    position:fixed; font-size:38px; z-index:200; pointer-events:none;
    animation: calcFly 1s cubic-bezier(.25,.6,.4,1) forwards;
  }
  @keyframes calcFly{
    0%{ transform:translate(0,0) rotate(0deg) scale(1); opacity:1; }
    70%{ opacity:1; }
    100%{ transform:translate(260px,-60px) rotate(560deg) scale(0.7); opacity:0; }
  }
  .next-btn{
    background:var(--gold); color:#241b00; border:none;
    font-family:'Oswald',sans-serif; font-weight:700; font-size:14px;
    padding:10px 26px; border-radius:9px; cursor:pointer;
    box-shadow:0 3px 0 var(--gold-dim);
  }
  .next-btn:disabled{ opacity:0.3; cursor:not-allowed; }

  /* ---- right: ladder ---- */
  .ladder{
    background:linear-gradient(180deg,#0e2a6e,#081638);
    border:2px solid var(--cyan);
    border-radius:12px;
    padding:8px 10px;
    display:flex; flex-direction:column-reverse;
    max-height:520px;
    overflow-y:auto;
  }
  .rung{
    display:flex; justify-content:space-between; gap:6px;
    padding:3.5px 6px; border-radius:5px;
    font-family:'Oswald',sans-serif; font-size:12px; color:var(--text-dim);
  }
  .rung.checkpoint{ color:var(--gold); }
  .rung.active{ background:var(--gold); color:#241b00; font-weight:700; }
  .rung.done{ color:var(--text); }

  /* ============ START / END ============ */
  .center-card{
    background:linear-gradient(180deg,#0e2a6e,#081638);
    border:2px solid var(--cyan);
    border-radius:16px;
    padding:40px 30px;
    text-align:center;
    max-width:560px;
    margin:60px auto;
  }
  .center-card h1{ font-family:'Oswald',sans-serif; color:var(--gold); font-size:28px; margin:0 0 12px; }
  .center-card p{ color:var(--text-dim); line-height:1.6; font-size:14.5px; }
  .rules{ text-align:left; display:grid; gap:9px; margin:20px 0; font-size:13.5px; }
  .rules .r{ display:flex; gap:9px; }
  .primary-btn{
    background:var(--gold); color:#241b00; border:none;
    font-family:'Oswald',sans-serif; font-weight:700; font-size:15px;
    padding:12px 24px; border-radius:9px; cursor:pointer;
    box-shadow:0 3px 0 var(--gold-dim);
  }
  .final-amount{ font-family:'Oswald',sans-serif; font-size:38px; color:var(--gold); margin:8px 0; }

  /* ============ MODALS ============ */
  .modal-bg{
    position:fixed; inset:0; background:rgba(2,6,20,0.75);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal{
    background:linear-gradient(180deg,#0e2a6e,#081638);
    border:2px solid var(--cyan); border-radius:16px;
    padding:24px; max-width:380px; width:100%; text-align:center;
  }
  .modal h3{ font-family:'Oswald',sans-serif; color:var(--gold); margin:4px 0 10px; }
  .ghost{ font-size:56px; animation:float 2.2s ease-in-out infinite; }
  @keyframes float{ 0%,100%{transform:translateY(0) rotate(-2deg);} 50%{transform:translateY(-10px) rotate(2deg);} }
  .modal-speech{
    background:rgba(255,255,255,0.06); border:1px solid rgba(120,170,255,0.3);
    border-radius:12px; padding:12px 14px; font-size:13.5px; text-align:left; margin:12px 0; line-height:1.5;
  }
  .modal-close{
    background:none; border:1px solid var(--cyan); color:var(--text);
    padding:9px 18px; border-radius:8px; cursor:pointer; margin-top:4px;
  }
  .abar-row{ display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:8px; }
  .abar-label{ width:16px; font-family:'Oswald',sans-serif; color:var(--gold); }
  .abar-track{ flex:1; background:rgba(255,255,255,0.08); border-radius:6px; height:14px; overflow:hidden; }
  .abar-fill{ height:100%; background:linear-gradient(90deg,var(--cyan-dim),var(--cyan)); width:0%; transition:width 1s ease; }
  .abar-pct{ width:34px; text-align:right; color:var(--text-dim); }
</style>
</head>

/* Призовая лестница в AED — 20 уровней, финал 500 000 AED */
const LEVEL_PRIZES = [
  500, 750, 1000, 1500, 2500,
  4000, 6000, 9000, 13000, 20000,
  30000, 45000, 65000, 95000, 140000,
  190000, 250000, 320000, 400000, 500000
];
const CHECKPOINTS = [4, 9, 14]; // индексы (0-based): уровни 5, 10, 15

let state = { screen:"start" };
let lastOrderKey = null;

function shuffledRoundOrder(){
  let order;
  let attempts = 0;
  do{
    order = ROUNDS.map((_,i)=>i);
    for(let i=order.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [order[i],order[j]] = [order[j],order[i]];
    }
    attempts++;
  } while(order.join(',') === lastOrderKey && attempts < 8);
  lastOrderKey = order.join(',');
  return order;
}
function currentRound(){ return ROUNDS[state.order[state.level]]; }

/* ---------------- таймер на ответ ---------------- */
const TIMER_SECONDS = 20;
let timerInterval = null;
let timeLeft = TIMER_SECONDS;

function clearTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
}
function updateTimerUI(){
  const num = document.getElementById('timerNum');
  if(num) num.textContent = timeLeft;
  const wrap = document.getElementById('timerWrap');
  if(wrap) wrap.classList.toggle('low', timeLeft <= 5);
}
function startTimer(){
  clearTimer();
  timeLeft = TIMER_SECONDS;
  updateTimerUI();
  timerInterval = setInterval(()=>{
    timeLeft--;
    updateTimerUI();
    if(timeLeft <= 0){
      clearTimer();
      handleTimeout();
    }
  }, 1000);
}
const REACT_TIMEOUT = [
  "Время вышло! Сколько можно копаться?!",
  "Ну всё, я не железный ждать тебя. Раз молчишь — вот ответ.",
  "Время истекло. Даже мой калькулятор возмущён такой медлительностью.",
  "Хватит тянуть! В следующий раз отвечай быстрее, а то я за себя не ручаюсь."
];
function handleTimeout(){
  if(state.screen !== "game" || state.answered) return;
  state.answered = true;
  state.selected = null;
  state.speechText = REACT_TIMEOUT[Math.floor(Math.random()*REACT_TIMEOUT.length)];
  render();
  throwCalculator();
}
function throwCalculator(){
  const host = document.getElementById('hostChar');
  const el = document.createElement('div');
  el.className = 'calc-throw';
  el.textContent = '🧮';
  if(host){
    const r = host.getBoundingClientRect();
    el.style.left = (r.left + r.width*0.55) + 'px';
    el.style.top = (r.top + r.height*0.35) + 'px';
  } else {
    el.style.left = '45%'; el.style.top = '140px';
  }
  document.body.appendChild(el);
  setTimeout(()=> el.remove(), 1100);
}

function fmtAED(v){ return v.toLocaleString('ru-RU') + " AED"; }
function fmtUnit(v){ return "$"+v.toFixed(1); }

function guaranteedAmount(level){
  // level = сколько вопросов уже пройдено верно (0 если ни одного)
  for(let i=CHECKPOINTS.length-1;i>=0;i--){
    if(level > CHECKPOINTS[i]) return LEVEL_PRIZES[CHECKPOINTS[i]];
  }
  return 0;
}

/* ---------------- рендер ---------------- */
function render(){
  const app = document.getElementById('app');
  if(state.screen==="start"){ app.innerHTML = renderStart(); attachStart(); return; }
  if(state.screen==="end"){ app.innerHTML = renderEnd(); attachEnd(); return; }
  app.innerHTML = renderGame();
  attachGame();
  requestAnimationFrame(()=>{
    const el = document.getElementById('speechBubble');
    if(el) requestAnimationFrame(()=> el.classList.add('show'));
  });
}

function renderStart(){
  return `
  <div class="center-card">
    <h1>Угадай FOB-цену</h1>
    <p>Перед тобой фото футболки: ткань, страна производства и декор — всё видно.
    Угадай реальную закупочную (FOB) цену за штуку из четырёх вариантов — 20 вопросов, от самой простой модели до самой сложной.</p>
    <div class="rules">
      <div class="r">📞 <div><b>Звонок другу</b> — бывший сотрудник, уже не в теме, но прикинет по опыту</div></div>
      <div class="r">➗ <div><b>50/50</b> — уберёт два неверных варианта</div></div>
      <div class="r">👥 <div><b>Помощь зала</b> — как ответили бы коллеги</div></div>
      <div class="r">💰 <div><b>Забрать</b> — зафиксировать текущий гарантированный выигрыш и выйти из игры</div></div>
    </div>
    <button class="primary-btn" id="startBtn">Начать игру</button>
  </div>`;
}
function attachStart(){
  document.getElementById('startBtn').onclick = ()=>{
    state = { screen:"game", level:0, order:shuffledRoundOrder(), selected:null, answered:false, removed:[], usedLifelines:{fifty:false,phone:false,audience:false}, speechText:"Смотри внимательно на ткань и декор!" };
    render();
    startTimer();
  };
}

function renderLadder(){
  let rows = "";
  for(let i=LEVEL_PRIZES.length-1;i>=0;i--){
    const isCheckpoint = CHECKPOINTS.includes(i);
    let cls = "rung";
    if(isCheckpoint) cls += " checkpoint";
    if(i===state.level) cls += " active";
    else if(i<state.level) cls += " done";
    rows += `<div class="${cls}"><span>${i+1}</span><span>${LEVEL_PRIZES[i].toLocaleString('ru-RU')}</span></div>`;
  }
  return `<div class="ladder">${rows}</div>`;
}

function shuffledOptions(round){
  if(round._shuffled) return round._shuffled;
  const arr = round.options.map(v=>({v, isCorrect: Math.abs(v-round.correct)<0.001}));
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  round._shuffled = arr;
  return arr;
}

function renderGame(){
  const round = currentRound();
  const opts = shuffledOptions(round);
  const guaranteed = guaranteedAmount(state.level);

  const optsHtml = opts.map((o,idx)=>{
    const letter = "АБВГ"[idx];
    let cls = "opt";
    if(state.removed.includes(idx)) cls += " removed";
    if(state.answered){
      if(o.isCorrect) cls += " correct";
      else if(idx===state.selected) cls += " wrong";
    } else if(idx===state.selected){ cls += " selected"; }
    return `<button class="${cls}" data-idx="${idx}" ${state.answered||state.removed.includes(idx)?"disabled":""}><b>${letter}:</b>${fmtUnit(o.v)}</button>`;
  }).join("");

  return `
  <div class="stage">
    <div class="content">
      <div class="iconbar">
        <div class="icon-group">
          <div class="icon-btn" title="Главная">🏠</div>
        </div>
        <div class="icon-group">
          <button class="icon-btn" id="lf-audience" title="Помощь зала" ${state.usedLifelines.audience?"disabled":""}>👥</button>
          <button class="icon-btn" id="lf-phone" title="Звонок другу" ${state.usedLifelines.phone?"disabled":""}>📞</button>
          <button class="icon-btn small" id="lf-fifty" title="50/50" ${state.usedLifelines.fifty?"disabled":""}>50/50</button>
        </div>
      </div>

      <div class="host-row">
        <div class="host-wrap">
          <div class="badge"><div class="q-n">${state.level+1}</div><div class="q-l">ВОПРОС</div></div>
          <div class="host" id="hostChar">${hostSVG()}</div>
        </div>
        <div class="speech" id="speechBubble">${state.speechText || "Смотри внимательно на ткань и декор!"}</div>
      </div>

      <div class="main-grid">
        <div class="side-left">
          <div class="win-box">
            <div class="lbl">Гарантировано</div>
            <div class="amt">${guaranteed.toLocaleString('ru-RU')}<br>AED</div>
            <button class="cashout-btn" id="cashoutBtn" ${state.answered?"disabled":""}>Забрать</button>
          </div>
        </div>

        <div>
          <div class="shirt-box"><img src="${round.img}" alt="${round.style||'футболка'}"></div>
          <div class="facts">
            <div class="fact">🌍 <b>${round.country}</b></div>
            <div class="fact">🧵 <b>${round.fabric}</b></div>
            <div class="fact">✨ <b>${round.decor}</b></div>
          </div>
          <div class="q-hex-row">
            <div class="q-hex">Сколько стоит эта футболка для нас по FOB (за 1 шт.)?</div>
            <div class="timer-wrap" id="timerWrap"><div class="timer-num" id="timerNum">${TIMER_SECONDS}</div></div>
          </div>
          <div class="options">${optsHtml}</div>
          <div class="footer-row">
            <button class="next-btn" id="nextBtn" ${state.answered?"":"disabled"}>${state.level===ROUNDS.length-1?"Забрать выигрыш":"Следующий вопрос"}</button>
          </div>
        </div>

        <div class="side-right">${renderLadder()}</div>
      </div>
    </div>
    <div class="audience-strip"></div>
  </div>`;
}

/* Истории/байки — показываются МЕЖДУ вопросами, а не как реакция на ответ */
const STORY_LINES = [

];

function attachGame(){
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick = ()=>{
      if(state.answered) return;
      clearTimer();
      state.selected = parseInt(btn.dataset.idx);
      state.answered = true;
      const opts = shuffledOptions(currentRound());
      const correct = opts[state.selected].isCorrect;
      state.speechText = correct
        ? REACT_CORRECT[Math.floor(Math.random()*REACT_CORRECT.length)]
        : REACT_WRONG[Math.floor(Math.random()*REACT_WRONG.length)];
      render();
    };
  });

  const nextBtn = document.getElementById('nextBtn');
  if(nextBtn) nextBtn.onclick = ()=>{
    const opts = shuffledOptions(currentRound());
    const wasCorrect = opts[state.selected] && opts[state.selected].isCorrect;
    if(!wasCorrect){
      clearTimer();
      state.screen = "end"; state.finalAmount = guaranteedAmount(state.level); state.won=false;
      render(); return;
    }
    if(state.level === ROUNDS.length-1){
      clearTimer();
      state.screen = "end"; state.finalAmount = LEVEL_PRIZES[LEVEL_PRIZES.length-1]; state.won=true;
      render(); return;
    }
    state.level += 1; state.selected=null; state.answered=false; state.removed=[];
    state.speechText = STORY_LINES[Math.floor(Math.random()*STORY_LINES.length)];
    render();
    startTimer();
  };

  const cashout = document.getElementById('cashoutBtn');
  if(cashout) cashout.onclick = ()=>{
    if(state.answered) return;
    clearTimer();
    state.screen = "end"; state.finalAmount = guaranteedAmount(state.level); state.won=false; state.cashed=true;
    render();
  };

  const fifty = document.getElementById('lf-fifty');
  if(fifty) fifty.onclick = ()=>{
    if(state.usedLifelines.fifty || state.answered) return;
    state.usedLifelines.fifty = true;
    const opts = shuffledOptions(currentRound());
    const wrongIdx = opts.map((o,i)=>o.isCorrect?-1:i).filter(i=>i>=0);
    for(let i=wrongIdx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [wrongIdx[i],wrongIdx[j]]=[wrongIdx[j],wrongIdx[i]]; }
    state.removed = wrongIdx.slice(0,2);
    render();
  };

  const phone = document.getElementById('lf-phone');
  if(phone) phone.onclick = ()=>{
    if(state.usedLifelines.phone || state.answered) return;
    state.usedLifelines.phone = true;
    showPhoneModal();
  };

  const audience = document.getElementById('lf-audience');
  if(audience) audience.onclick = ()=>{
    if(state.usedLifelines.audience || state.answered) return;
    state.usedLifelines.audience = true;
    showAudienceModal();
  };
}

const PHONE_CHARACTERS = [

];

function showPhoneModal(){
  const round = currentRound();
  const opts = shuffledOptions(round);
  const availableIdx = opts.map((o,i)=>i).filter(i=>!state.removed.includes(i));
  const correctIdx = opts.findIndex(o=>o.isCorrect);
  let suggestIdx;
  const knowsIt = Math.random() < 0.7 && availableIdx.includes(correctIdx);
  if(knowsIt){ suggestIdx = correctIdx; }
  else{
    const wrongPool = availableIdx.filter(i=>i!==correctIdx);
    suggestIdx = wrongPool.length ? wrongPool[Math.floor(Math.random()*wrongPool.length)] : correctIdx;
  }
  const letter = "АБВГ"[suggestIdx];
  const line = knowsIt
    ? PHONE_LINES_RIGHT[Math.floor(Math.random()*PHONE_LINES_RIGHT.length)]
    : PHONE_LINES_WRONG[Math.floor(Math.random()*PHONE_LINES_WRONG.length)];
  const character = PHONE_CHARACTERS[Math.floor(Math.random()*PHONE_CHARACTERS.length)];

  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.innerHTML = `
    <div class="modal">
      <div class="ghost">${character.emoji}</div>
      <h3>Звонок бывшему сотруднику</h3>
      <div style="color:var(--text-dim); font-size:12.5px; margin-top:-6px; margin-bottom:2px;">${character.name}</div>
      <div class="modal-speech">${line} <b>вариант ${letter} (${fmtUnit(opts[suggestIdx].v)})</b>. И вообще, не звони мне больше по этому поводу 😤</div>
      <button class="modal-close" id="closePhone">Закрыть</button>
    </div>`;
  document.body.appendChild(modal);
  document.getElementById('closePhone').onclick = ()=> modal.remove();
}

function showAudienceModal(){
  const round = currentRound();
  const opts = shuffledOptions(round);
  const availableIdx = opts.map((o,i)=>i).filter(i=>!state.removed.includes(i));
  const correctIdx = opts.findIndex(o=>o.isCorrect);

  let weights = availableIdx.map(i=> i===correctIdx ? (40+Math.random()*30) : (5+Math.random()*25));
  const sum = weights.reduce((a,b)=>a+b,0);
  let pcts = weights.map(w=>Math.round(w/sum*100));
  let diff = 100 - pcts.reduce((a,b)=>a+b,0);
  pcts[0]+=diff;

  const rowsHtml = availableIdx.map((idx,k)=>{
    const letter = "АБВГ"[idx];
    return `<div class="abar-row">
      <div class="abar-label">${letter}</div>
      <div class="abar-track"><div class="abar-fill" id="bar-${k}" data-pct="${pcts[k]}"></div></div>
      <div class="abar-pct">${pcts[k]}%</div>
    </div>`;
  }).join("");

  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.innerHTML = `<div class="modal"><h3>👥 Помощь зала</h3><div>${rowsHtml}</div><button class="modal-close" id="closeAud">Закрыть</button></div>`;
  document.body.appendChild(modal);
  requestAnimationFrame(()=>{
    availableIdx.forEach((idx,k)=>{
      const el = document.getElementById('bar-'+k);
      if(el) el.style.width = el.dataset.pct+"%";
    });
  });
  document.getElementById('closeAud').onclick = ()=> modal.remove();
}

function renderEnd(){
  return `
  <div class="center-card">
    <h1>${state.won ? "Идеально! 🏆" : (state.cashed ? "Забрано!" : "Игра окончена")}</h1>
    <p>${state.won ? "Вы точно разбираетесь в себестоимости — все 20 вопросов позади." : (state.cashed ? "Разумное решение — зафиксировали выигрыш." : "Не страшно — с опытом глаз наостряется на ткань и декор.")}</p>
    <div class="final-amount">${state.finalAmount.toLocaleString('ru-RU')} AED</div>
    <button class="primary-btn" id="againBtn">Играть заново</button>
  </div>`;
}
function attachEnd(){
  document.getElementById('againBtn').onclick = ()=>{ state = {screen:"start"}; render(); };
}

render();
