<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Угадай FOB-цену</title>
<style>
  :root{
    --space-1:#0a2a8a;
    --space-2:#06185a;
    --space-3:#020a2e;
    --orange:#f5a623;
    --orange-hi:#ffc04d;
    --white:#ffffff;
    --silver-1:#e9eef7;
    --silver-2:#8a97b3;
    --line:#5f8cff;
    --green:#2fae3f;
    --red:#d63a3a;
    --text-dim:#a9b8e0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    color:var(--white);
    font-family:Arial, "Helvetica Neue", Helvetica, sans-serif;
    min-height:100vh;
    background:var(--space-3);
  }

  /* ============ SPACE BACKGROUND ============ */
  .space{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 60% 45% at 30% 35%, rgba(70,120,255,0.55) 0%, transparent 70%),
      radial-gradient(ellipse 40% 35% at 75% 20%, rgba(60,90,230,0.45) 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 60% 85%, rgba(40,70,200,0.40) 0%, transparent 70%),
      linear-gradient(160deg, var(--space-1) 0%, var(--space-2) 50%, var(--space-3) 100%);
  }
  .stars, .stars2, .stars3{ position:absolute; inset:0; }
  .stars{
    background-image:
      radial-gradient(1px 1px at 20px 30px, #fff, transparent),
      radial-gradient(1px 1px at 90px 120px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 160px 60px, #dfe8ff, transparent),
      radial-gradient(1px 1px at 230px 170px, #fff, transparent),
      radial-gradient(1px 1px at 50px 200px, #cfdcff, transparent),
      radial-gradient(1.2px 1.2px at 280px 20px, #fff, transparent);
    background-size:300px 230px;
    opacity:0.85;
  }
  .stars2{
    background-image:
      radial-gradient(2px 2px at 60px 80px, #fff, transparent),
      radial-gradient(1.6px 1.6px at 340px 260px, #e6eeff, transparent),
      radial-gradient(2px 2px at 420px 40px, #fff, transparent);
    background-size:520px 380px;
    animation:twinkle 4s ease-in-out infinite alternate;
  }
  .stars3{
    background-image:
      radial-gradient(3px 3px at 120px 140px, rgba(255,255,255,0.95), transparent),
      radial-gradient(2.5px 2.5px at 600px 420px, rgba(220,232,255,0.9), transparent);
    background-size:780px 560px;
    filter:drop-shadow(0 0 4px #fff);
    animation:twinkle 6s ease-in-out infinite alternate-reverse;
  }
  .beams{
    position:absolute; left:50%; top:-30%; width:200vmax; height:200vmax; margin-left:-100vmax;
    background:repeating-conic-gradient(from 0deg at 50% 50%, rgba(140,180,255,0.07) 0deg 3deg, transparent 3deg 22deg);
    mask-image:radial-gradient(circle at 50% 50%, #000 0%, transparent 55%);
    -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 0%, transparent 55%);
    animation:spin 120s linear infinite;
  }
  .floor{
    position:absolute; left:0; right:0; bottom:0; height:30%;
    background:radial-gradient(ellipse 70% 100% at 45% 100%, rgba(80,130,255,0.35), transparent 70%);
  }
  .flare{
    position:absolute; width:340px; height:340px; border-radius:50%;
    background:radial-gradient(circle, rgba(200,220,255,0.35) 0%, rgba(120,160,255,0.12) 25%, transparent 60%);
    mix-blend-mode:screen;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes twinkle{ from{opacity:0.45;} to{opacity:1;} }

  #app{ position:relative; z-index:1; min-height:100vh; overflow-x:hidden; }

  /* ============ LAYOUT ============ */
  .game{
    display:grid;
    grid-template-columns:1fr 260px;
    min-height:100vh;
  }
  .main{
    display:flex; flex-direction:column; justify-content:center;
    padding:20px clamp(12px,3vw,40px) 24px;
    min-width:0;
  }
  .panel{
    border-left:2px solid rgba(140,175,255,0.75);
    box-shadow:-6px 0 18px rgba(0,0,0,0.35);
    background:linear-gradient(180deg, rgba(4,14,60,0.55), rgba(2,8,36,0.7));
    padding:18px 16px;
    display:flex; flex-direction:column; gap:18px;
  }
  @media (max-width:860px){
    .game{ grid-template-columns:1fr; }
    .panel{ border-left:none; border-top:2px solid rgba(140,175,255,0.75); }
  }

  /* ============ ROUND LOGO / PHOTO STAGE ============ */
  .stage-top{ position:relative; display:flex; flex-direction:column; align-items:center; margin-bottom:10px; }
  .ring{
    position:relative;
    width:min(340px, 74vw);
    aspect-ratio:1;
  }
  .ring svg{ position:absolute; inset:0; width:100%; height:100%; filter:drop-shadow(0 8px 22px rgba(0,0,0,0.55)); }
  .ring .photo{
    position:absolute; left:50%; top:50%;
    width:60%; height:60%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#fff;
    overflow:hidden;
    border:3px solid #c9d3e8;
    box-shadow:0 0 0 3px #1b2550, 0 0 26px rgba(120,160,255,0.55);
    display:flex; align-items:center; justify-content:center;
  }
  .ring .photo img{ width:84%; height:84%; object-fit:contain; }

  .timer{
    position:absolute; right:-9%; bottom:0;
    width:84px; height:84px; border-radius:50%;
    background:radial-gradient(circle at 40% 30%, #2a3f8a 0%, #0a1240 55%, #02061a 100%);
    box-shadow:0 0 0 3px #c9d3e8, 0 0 0 6px #0a1233, 0 8px 20px rgba(0,0,0,0.6), inset 0 6px 12px rgba(255,255,255,0.12);
    display:flex; align-items:center; justify-content:center;
  }
  .timer svg{ position:absolute; inset:5px; width:calc(100% - 10px); height:calc(100% - 10px); transform:rotate(-90deg); }
  .timer .track{ fill:none; stroke:rgba(255,255,255,0.1); stroke-width:6; }
  .timer .arc{ fill:none; stroke:#5fb4ff; stroke-width:6; stroke-linecap:round; transition:stroke-dashoffset 1s linear, stroke .3s; filter:drop-shadow(0 0 4px #5fb4ff); }
  .timer .num{ position:relative; font-weight:700; font-size:26px; color:#fff; text-shadow:0 0 8px rgba(120,180,255,0.8); }
  .timer.mid .arc{ stroke:var(--orange); filter:drop-shadow(0 0 4px var(--orange)); }
  .timer.low .arc{ stroke:#ff4a3a; filter:drop-shadow(0 0 6px #ff4a3a); }
  .timer.low .num{ color:#ffb3a8; }
  .timer.low{ animation:pulse .8s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.1);} }

  .facts{ display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .fact{
    font-size:12.5px; color:var(--text-dim);
    background:rgba(0,0,0,0.45);
    border:1px solid rgba(160,185,240,0.55);
    border-radius:100px; padding:5px 12px;
  }
  .fact b{ color:var(--white); font-weight:600; }

  /* ============ LOZENGES (question / answers) ============ */
  .loz-row{ position:relative; }
  .loz-row::before{
    content:""; position:absolute; left:-60px; right:-60px; top:50%; height:2px;
    background:linear-gradient(90deg, transparent, #8aa6e6 12%, #c9d6f5 50%, #8aa6e6 88%, transparent);
    transform:translateY(-50%);
    z-index:0;
  }
  .loz{
    --cut:26px;
    position:relative; z-index:1;
    clip-path:polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% 50%, calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 50%);
    background:linear-gradient(180deg, #f2f5fb 0%, #9aa7c2 45%, #5b6683 55%, #c3cce0 100%);
    padding:2px;
  }
  .loz-in{
    position:relative;
    clip-path:polygon(calc(var(--cut) - 1px) 0, calc(100% - var(--cut) + 1px) 0, 100% 50%, calc(100% - var(--cut) + 1px) 100%, calc(var(--cut) - 1px) 100%, 0 50%);
    background:linear-gradient(180deg, #24304f 0%, #0b1022 40%, #000 60%, #0f1730 100%);
    color:var(--white);
    width:100%; height:100%;
  }
  .loz-in::before{
    content:""; position:absolute; left:0; right:0; top:0; height:48%;
    background:linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0.04));
    pointer-events:none;
  }
  .loz-in::after{
    content:""; position:absolute; inset:0;
    box-shadow:inset 0 0 14px rgba(90,140,255,0.35);
    pointer-events:none;
  }
  .loz-in > *{ position:relative; }
  .loz{ filter:drop-shadow(0 4px 8px rgba(0,0,0,0.55)); }
  .question .loz-in{ text-shadow:0 1px 2px #000; }
  .question .loz{ --cut:40px; }
  .question .loz-in{
    padding:22px 56px; text-align:center;
    font-size:clamp(16px, 1.9vw, 21px); line-height:1.35;
    min-height:76px; display:flex; align-items:center; justify-content:center;
  }

  .answers{ display:grid; grid-template-columns:1fr 1fr; gap:12px 22px; margin-top:16px; }
  @media (max-width:560px){ .answers{ grid-template-columns:1fr; } }
  .ans-btn{
    all:unset; display:block; cursor:pointer; width:100%;
  }
  .ans-btn:focus-visible .loz{ outline:2px solid var(--orange); }
  .ans-btn .loz-in{
    display:flex; align-items:center; gap:10px;
    padding:12px 34px; min-height:46px;
    font-size:clamp(15px,1.6vw,19px);
  }
  .ans-btn .dot{ width:8px; height:8px; border-radius:50%; background:var(--orange); flex:none; box-shadow:0 0 6px var(--orange); }
  .ans-btn .let{ color:var(--orange); }
  .ans-btn:hover:not([disabled]) .loz-in{ background:linear-gradient(180deg,#334474 0%,#141c3a 45%,#060a18 60%,#1b2648 100%); }
  .ans-btn[disabled]{ cursor:default; }
  .ans-btn.removed .loz-in > *{ visibility:hidden; }

  .ans-btn.locked .loz-in{ background:linear-gradient(180deg,#ffd27a 0%,#f5a623 50%,#c77a00 100%); color:#000; animation:lockGlow 1s ease-in-out infinite alternate; }
  .ans-btn.locked .let{ color:#000; }
  .ans-btn.locked .dot{ background:#000; box-shadow:none; }
  @keyframes lockGlow{ to{ filter:brightness(1.15); } }
  .ans-btn.selected .loz-in{ background:linear-gradient(180deg,#ffd27a 0%,#f5a623 50%,#c77a00 100%); color:#000; }
  .ans-btn.selected .let, .ans-btn.selected .dot{ color:#000; background-color:#000; box-shadow:none; }
  .ans-btn.selected .let{ background:none; }
  .ans-btn.correct .loz-in{ background:linear-gradient(180deg,#7be38a 0%,#2fae3f 50%,#16701f 100%); color:#fff; }
  .ans-btn.correct .let{ color:#fff; }
  .ans-btn.correct .dot{ background:#fff; box-shadow:none; }
  .ans-btn.correct.blink .loz-in{ animation:blink .3s steps(2) 5; }
  @keyframes blink{ 50%{ filter:brightness(0.55);} }
  .ans-btn.wrong .loz-in{ background:linear-gradient(180deg,#ffd27a 0%,#f5a623 50%,#c77a00 100%); color:#000; }
  .ans-btn.wrong .let{ color:#000; }
  .ans-btn.wrong .dot{ background:#000; box-shadow:none; }

  .feedback{ text-align:center; min-height:24px; margin-top:14px; font-size:15px; color:var(--silver-1); }
  .feedback.ok{ color:#8ff09b; }
  .feedback.bad{ color:var(--orange-hi); }

  .bottom-row{ display:flex; justify-content:center; margin-top:10px; }
  .loz-btn{ all:unset; cursor:pointer; display:inline-block; min-width:240px; }
  .loz-btn .loz{ --cut:20px; }
  .loz-btn .loz-in{ padding:11px 34px; text-align:center; font-size:16px; font-weight:700; letter-spacing:0.03em; }
  .loz-btn:hover:not([disabled]) .loz-in{ background:linear-gradient(180deg,#ffd27a 0%,#f5a623 50%,#c77a00 100%); color:#000; }
  .loz-btn[disabled]{ opacity:0.35; cursor:not-allowed; }
  .loz-btn.primary .loz-in{ background:linear-gradient(180deg,#ffd27a 0%,#f5a623 50%,#c77a00 100%); color:#000; }
  .loz-btn.primary:hover .loz-in{ filter:brightness(1.08); }

  /* ============ RIGHT PANEL ============ */
  .lifelines{ display:flex; justify-content:space-between; gap:8px; }
  .life{
    all:unset; cursor:pointer; position:relative;
    width:70px; height:46px; border-radius:50%;
    background:radial-gradient(ellipse at 50% 30%, #3a4f8c 0%, #101a40 55%, #050a1f 100%);
    border:2px solid #b9c5e2;
    box-shadow:0 0 0 2px #0a1233, 0 3px 8px rgba(0,0,0,0.5);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:15px; color:#fff;
    transition:transform .12s ease;
  }
  .life:hover:not([disabled]){ transform:translateY(-2px); box-shadow:0 0 0 2px #0a1233, 0 0 14px rgba(140,180,255,0.7); }
  .life svg{ width:30px; height:30px; position:relative; }
  .life::before{ content:""; position:absolute; left:14%; right:14%; top:4px; height:40%; border-radius:50%; background:linear-gradient(180deg,rgba(255,255,255,0.35),rgba(255,255,255,0)); pointer-events:none; }
  .life[disabled]{ cursor:not-allowed; opacity:0.55; }
  .life[disabled]::after{
    content:""; position:absolute; inset:6px 14px;
    background:
      linear-gradient(35deg, transparent 46%, var(--red) 46% 54%, transparent 54%),
      linear-gradient(-35deg, transparent 46%, var(--red) 46% 54%, transparent 54%);
  }

  .ladder{ display:flex; flex-direction:column-reverse; gap:1px; }
  .rung{
    display:grid; grid-template-columns:34px 14px 1fr; align-items:center;
    padding:2px 10px; border-radius:100px;
    font-size:16px; font-weight:700; line-height:1.35;
    color:var(--orange);
  }
  .rung .n{ text-align:right; }
  .rung .m{ text-align:center; font-size:9px; }
  .rung .p{ padding-left:4px; }
  .rung.checkpoint{ color:var(--white); }
  .rung.active{
    background:linear-gradient(180deg,#ffd27a 0%,#f5a623 50%,#d98a00 100%);
    color:#fff; text-shadow:0 1px 1px rgba(0,0,0,0.45);
  }
  .rung.done .m::before{ content:"◆"; color:var(--orange); }
  .rung.active{ box-shadow:0 0 12px rgba(245,166,35,0.6), inset 0 1px 0 rgba(255,255,255,0.6); }

  .panel-foot{ margin-top:auto; display:flex; flex-direction:column; gap:10px; align-items:stretch; }
  .guar{ text-align:center; font-size:12.5px; color:var(--text-dim); }
  .guar b{ display:block; color:var(--orange); font-size:18px; margin-top:2px; }
  .panel .loz-btn{ min-width:0; width:100%; }

  @media (max-width:860px){
    .ladder{ display:grid; grid-template-columns:repeat(2, 1fr); gap:2px 10px; }
    .rung{ font-size:14px; }
  }

  /* ============ START / END ============ */
  .center{
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:30px 16px; text-align:center; gap:18px;
  }
  .center .ring{ width:min(380px, 80vw); }
  .center .loz-row{ width:min(720px, 100%); }
  .center .question .loz-in{ flex-direction:column; gap:6px; }
  .center .sub{ font-size:14px; color:var(--text-dim); }
  .rules{ display:grid; grid-template-columns:1fr 1fr; gap:10px 22px; width:min(720px,100%); text-align:left; }
  @media (max-width:560px){ .rules{ grid-template-columns:1fr; } }
  .rules .loz-in{ display:flex; align-items:center; gap:10px; padding:10px 30px; font-size:14px; }
  .rules .let{ color:var(--orange); font-weight:700; }
  .final-amount{ font-size:clamp(34px,6vw,54px); font-weight:700; color:var(--orange); text-shadow:0 0 18px rgba(245,166,35,0.45); }

  /* ============ MODALS ============ */
  .modal-bg{
    position:fixed; inset:0; background:rgba(0,4,20,0.75);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal{
    background:linear-gradient(180deg,#14214f,#040a24);
    border:2px solid #b9c5e2; border-radius:18px;
    box-shadow:0 0 0 3px #050b26, 0 0 30px rgba(110,150,255,0.45);
    padding:24px; max-width:400px; width:100%; text-align:center;
  }
  .modal h3{ color:var(--orange); margin:4px 0 10px; font-size:19px; }
  .modal .who{ font-size:40px; }
  .modal .name{ color:var(--text-dim); font-size:13px; margin-bottom:4px; }
  .modal-speech{
    background:rgba(0,0,0,0.4); border:1px solid rgba(160,185,240,0.45);
    border-radius:12px; padding:12px 14px; font-size:14px; text-align:left; margin:12px 0; line-height:1.5;
  }
  .modal .loz-btn{ min-width:160px; margin-top:6px; }
  .bars{ display:flex; justify-content:center; align-items:flex-end; gap:16px; height:170px; margin:16px 0 6px; }
  .bar{ display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; width:44px; }
  .bar .pct{ font-size:13px; margin-bottom:4px; }
  .bar .col{ width:100%; height:0; background:linear-gradient(180deg,#ffd27a,#f5a623 60%,#b56d00); border:1px solid #ffe2a8; transition:height 1s ease; }
  .bar .l{ margin-top:6px; color:var(--orange); font-weight:700; }
</style>
</head>
<body>
<div class="space"><div class="beams"></div><div class="stars"></div><div class="stars2"></div><div class="stars3"></div><div class="floor"></div><div class="flare" style="left:8%;top:12%"></div><div class="flare" style="right:22%;bottom:6%;width:240px;height:240px"></div></div>
<div id="app"></div>

/* Призовая лестница в AED — 20 уровней, финал 500 000 AED */
const LEVEL_PRIZES = [
  500, 750, 1000, 1500, 2500,
  4000, 6000, 9000, 13000, 20000,
  30000, 45000, 65000, 95000, 140000,
  190000, 250000, 320000, 400000, 500000
];
const CHECKPOINTS = [4, 9, 14]; // индексы (0-based): уровни 5, 10, 15
const LETTERS = ["A","B","C","D"];

let state = { screen:"start" };
let lastOrderKey = null;

function shuffledRoundOrder(){
  let order;
  let attempts = 0;
  do{
    order = ROUNDS.map((_,i)=>i);
    for(let i=order.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [order[i],order[j]] = [order[j],order[i]];
    }
    attempts++;
  } while(order.join(',') === lastOrderKey && attempts < 8);
  lastOrderKey = order.join(',');
  return order;
}
function currentRound(){ return ROUNDS[state.order[state.level]]; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* ---------------- таймер на ответ ---------------- */
const TIMER_SECONDS = 60;
let timerInterval = null;
let timeLeft = TIMER_SECONDS;

function clearTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
}
const TIMER_LEN = 2*Math.PI*34;
function timerHTML(){
  const frac = state.answered || state.locked!=null ? 0 : timeLeft/TIMER_SECONDS;
  return `<svg viewBox="0 0 74 74"><circle class="track" cx="37" cy="37" r="34"/><circle class="arc" id="timerArc" cx="37" cy="37" r="34" stroke-dasharray="${TIMER_LEN}" stroke-dashoffset="${TIMER_LEN*(1-frac)}"/></svg><span class="num" id="timerNum">${state.answered||state.locked!=null ? "—" : timeLeft}</span>`;
}
function updateTimerUI(){
  const el = document.getElementById('timer');
  if(!el) return;
  document.getElementById('timerNum').textContent = timeLeft;
  document.getElementById('timerArc').setAttribute('stroke-dashoffset', TIMER_LEN*(1-timeLeft/TIMER_SECONDS));
  el.classList.toggle('mid', timeLeft <= 20 && timeLeft > 10);
  el.classList.toggle('low', timeLeft <= 10);
}
function isBusy(){ return state.answered || state.locked!=null; }
function startTimer(){
  clearTimer();
  timeLeft = TIMER_SECONDS;
  updateTimerUI();
  timerInterval = setInterval(()=>{
    timeLeft--;
    updateTimerUI();
    if(timeLeft <= 0){
      clearTimer();
      handleTimeout();
    }
  }, 1000);
}
const REACT_TIMEOUT = [
  "Время вышло! Правильный ответ подсвечен зелёным.",
  "Время истекло — отвечать нужно быстрее.",
  "Увы, минута прошла."
];
function handleTimeout(){
  if(state.screen !== "game" || isBusy()) return;
  state.answered = true;
  state.selected = null;
  state.feedback = { text:pick(REACT_TIMEOUT), cls:"bad" };
  render();
}

function fmtAED(v){ return v.toLocaleString('ru-RU') + " AED"; }
function fmtUnit(v){ return "$"+v.toFixed(1); }

function guaranteedAmount(level){
  // level = сколько вопросов уже пройдено верно (0 если ни одного)
  for(let i=CHECKPOINTS.length-1;i>=0;i--){
    if(level > CHECKPOINTS[i]) return LEVEL_PRIZES[CHECKPOINTS[i]];
  }
  return 0;
}

function loz(inner, extraCls){
  return `<div class="loz ${extraCls||''}"><div class="loz-in">${inner}</div></div>`;
}

/* ---------------- рендер ---------------- */
function render(){
  const app = document.getElementById('app');
  if(state.screen==="start"){ app.innerHTML = renderStart(); attachStart(); return; }
  if(state.screen==="end"){ app.innerHTML = renderEnd(); attachEnd(); return; }
  app.innerHTML = renderGame();
  attachGame();
}

function renderStart(){
  const rules = [
    ["A","50/50 — убирает два неверных варианта"],
    ["B","Помощь зала — как ответили бы коллеги"],
    ["C","Звонок другу — бывший сотрудник подскажет"],
    ["D","Забрать — уйти с гарантированной суммой"]
  ].map(([l,t])=>`<div class="loz-row">${loz(`<span class="let">${l}:</span><span>${t}</span>`)}</div>`).join("");
  return `
  <div class="center">
    <div class="ring">${ringSVG(true)}</div>
    <div class="loz-row question">${loz(`
      <div>По фото, ткани, стране и декору угадай закупочную (FOB) цену футболки за штуку.</div>

    <div class="rules">${rules}</div>
    <button class="loz-btn primary" id="startBtn">${loz("НАЧАТЬ ИГРУ")}</button>
  </div>`;
}
function attachStart(){
  document.getElementById('startBtn').onclick = ()=>{
    ROUNDS.forEach(r=>{ delete r._shuffled; });
    state = { screen:"game", level:0, order:shuffledRoundOrder(), selected:null, locked:null, answered:false, removed:[], usedLifelines:{fifty:false,phone:false,audience:false}, feedback:null };
    render();
    startTimer();
  };
}

function renderLadder(){
  let rows = "";
  for(let i=0;i<LEVEL_PRIZES.length;i++){
    let cls = "rung";
    if(CHECKPOINTS.includes(i)) cls += " checkpoint";
    if(i===state.level) cls += " active";
    else if(i<state.level) cls += " done";
    rows += `<div class="${cls}"><span class="n">${i+1}</span><span class="m"></span><span class="p">${LEVEL_PRIZES[i].toLocaleString('ru-RU')}</span></div>`;
  }
  return `<div class="ladder">${rows}</div>`;
}

function shuffledOptions(round){
  if(round._shuffled) return round._shuffled;
  const arr = round.options.map(v=>({v, isCorrect: Math.abs(v-round.correct)<0.001}));
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  round._shuffled = arr;
  return arr;
}

const ICON_AUDIENCE = `<svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2"><circle cx="16" cy="11" r="4"/><path d="M9 25c0-4 3-7 7-7s7 3 7 7"/><circle cx="7.5" cy="13" r="3"/><path d="M2.5 24c0-3 2-5.5 5-5.5"/><circle cx="24.5" cy="13" r="3"/><path d="M29.5 24c0-3-2-5.5-5-5.5"/></svg>`;
const ICON_PHONE = `<svg viewBox="0 0 32 32" fill="#fff"><path d="M6 12c0-3 4-6 10-6s10 3 10 6v2h-5v-3c-1.5-.7-3.2-1-5-1s-3.5.3-5 1v3H6z"/><path d="M9 17l3-4h8l3 4v8H9z"/><circle cx="16" cy="20.5" r="2.4" fill="#0b1433"/></svg>`;

function renderGame(){
  const round = currentRound();
  const opts = shuffledOptions(round);
  const guaranteed = guaranteedAmount(state.level);

  const ansHtml = opts.map((o,idx)=>{
    let cls = "ans-btn";
    if(state.removed.includes(idx)) cls += " removed";
    if(state.answered){
      if(o.isCorrect) cls += " correct blink";
      else if(idx===state.selected) cls += " wrong";
    } else if(idx===state.locked){ cls += " locked"; }
    const dis = isBusy() || state.removed.includes(idx);
    return `<button class="${cls}" data-idx="${idx}" ${dis?"disabled":""}>${loz(`<span class="dot"></span><span class="let">${LETTERS[idx]}:</span><span>${fmtUnit(o.v)}</span>`)}</button>`;
  }).join("");

  const fb = state.feedback;
  const isLast = state.level===ROUNDS.length-1;

  return `
  <div class="game">
    <div class="main">
      <div class="stage-top">
        <div class="ring">
          ${ringSVG(false)}
          <div class="photo"><img src="${round.img}" alt="${round.style||'футболка'}"></div>
          <div class="timer" id="timer">${timerHTML()}</div>
        </div>
        <div class="facts">
          <div class="fact">🌍 <b>${round.country}</b></div>
          <div class="fact">🧵 <b>${round.fabric}</b></div>
          <div class="fact">✨ <b>${round.decor}</b></div>
        </div>
      </div>

      <div class="loz-row question">${loz(`Вопрос ${state.level+1}. Сколько стоит эта футболка для нас по FOB (за 1 шт.)?`)}</div>
      <div class="answers">${ansHtml}</div>
      <div class="feedback ${fb?fb.cls:''}">${fb?fb.text:""}</div>
      <div class="bottom-row">
        <button class="loz-btn" id="nextBtn" ${state.answered?"":"disabled"}>${loz(isLast?"ЗАБРАТЬ ВЫИГРЫШ":"СЛЕДУЮЩИЙ ВОПРОС")}</button>
      </div>
    </div>

    <aside class="panel">
      <div class="lifelines">
        <button class="life" id="lf-fifty" title="50/50" ${state.usedLifelines.fifty?"disabled":""}>50/50</button>
        <button class="life" id="lf-audience" title="Помощь зала" ${state.usedLifelines.audience?"disabled":""}>${ICON_AUDIENCE}</button>
        <button class="life" id="lf-phone" title="Звонок другу" ${state.usedLifelines.phone?"disabled":""}>${ICON_PHONE}</button>
      </div>
      ${renderLadder()}
      <div class="panel-foot">
        <div class="guar">Гарантировано<b>${fmtAED(guaranteed)}</b></div>
        <button class="loz-btn" id="cashoutBtn" ${isBusy()?"disabled":""}>${loz("ЗАБРАТЬ ДЕНЬГИ")}</button>
      </div>
    </aside>
  </div>`;
}

const REACT_CORRECT = [
  "Абсолютно верно!",
  "В точку!",
  "Отличный глаз на ткань!",
  "Именно так!",
  "Верно. Хоть кто-то тут читает спецификации."
];
const REACT_WRONG = [
  "Увы, это неверный ответ.",
  "Мимо! Правильный ответ подсвечен зелёным.",
  "Не угадал. Иди ещё раз спецификацию почитай."
];

function attachGame(){
  document.querySelectorAll('.ans-btn').forEach(btn=>{
    btn.onclick = ()=>{
      if(isBusy()) return;
      clearTimer();
      const idx = parseInt(btn.dataset.idx);
      state.locked = idx;
      state.feedback = { text:"Это ваш окончательный ответ…", cls:"" };
      render();
      setTimeout(()=>{
        if(state.screen!=="game" || state.locked!==idx) return;
        state.locked = null;
        state.selected = idx;
        state.answered = true;
        const correct = shuffledOptions(currentRound())[idx].isCorrect;
        state.feedback = correct
          ? { text:pick(REACT_CORRECT), cls:"ok" }
          : { text:pick(REACT_WRONG), cls:"bad" };
        render();
      }, 2200);
    };
  });

  const nextBtn = document.getElementById('nextBtn');
  if(nextBtn) nextBtn.onclick = ()=>{
    const opts = shuffledOptions(currentRound());
    const wasCorrect = opts[state.selected] && opts[state.selected].isCorrect;
    if(!wasCorrect){
      clearTimer();
      state.screen = "end"; state.finalAmount = guaranteedAmount(state.level); state.won=false;
      render(); return;
    }
    if(state.level === ROUNDS.length-1){
      clearTimer();
      state.screen = "end"; state.finalAmount = LEVEL_PRIZES[LEVEL_PRIZES.length-1]; state.won=true;
      render(); return;
    }
    state.level += 1; state.selected=null; state.answered=false; state.removed=[]; state.feedback=null;
    timeLeft = TIMER_SECONDS;
    render();
    startTimer();
  };

  const cashout = document.getElementById('cashoutBtn');
  if(cashout) cashout.onclick = ()=>{
    if(isBusy()) return;
    clearTimer();
    state.screen = "end"; state.finalAmount = guaranteedAmount(state.level); state.won=false; state.cashed=true;
    render();
  };

  const fifty = document.getElementById('lf-fifty');
  if(fifty) fifty.onclick = ()=>{
    if(state.usedLifelines.fifty || isBusy()) return;
    state.usedLifelines.fifty = true;
    const opts = shuffledOptions(currentRound());
    const wrongIdx = opts.map((o,i)=>o.isCorrect?-1:i).filter(i=>i>=0);
    for(let i=wrongIdx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [wrongIdx[i],wrongIdx[j]]=[wrongIdx[j],wrongIdx[i]]; }
    state.removed = wrongIdx.slice(0,2);
    render();
  };

  const phone = document.getElementById('lf-phone');
  if(phone) phone.onclick = ()=>{
    if(state.usedLifelines.phone || isBusy()) return;
    state.usedLifelines.phone = true;
    render();
    showPhoneModal();
  };

  const audience = document.getElementById('lf-audience');
  if(audience) audience.onclick = ()=>{
    if(state.usedLifelines.audience || isBusy()) return;
    state.usedLifelines.audience = true;
    render();
    showAudienceModal();
  };
}

const PHONE_CHARACTERS = [
  { name:"Игорь, бывший технолог", emoji:"🧔" },
  { name:"Марина, бывший байер", emoji:"👩‍💼" },
  { name:"Дед Толя, охрана склада", emoji:"👴" },
  { name:"Стас, бывший курьер", emoji:"🧑" },
  { name:"Тётя Валя, бухгалтерия", emoji:"👵" },
  { name:"Рустам, бывший логист", emoji:"🕴️" },
  { name:"Оксана, бывший мерчандайзер", emoji:"👩" },
];
const PHONE_LINES_RIGHT = [
  "Так, ты опять?! Я ж говорил — я тут вообще ни при чём больше. Ладно, чисто отвяжись — на глаз это",
  "Серьёзно, снова мне звонишь по этому поводу? Я уже полгода не в теме. Но раз пристал — похоже на",
  "Слушай, у меня своих дел полно, а ты со старыми ценами лезешь... Ладно, навскидку —",
  "Опять ты! Я ж просил не дёргать меня по рабочим вопросам. Но так и быть — это",
];
const PHONE_LINES_WRONG = [
  "Ты серьёзно снова мне звонишь? Я вообще без понятия, отстань уже и скажи",
  "Слушай, задолбал уже с этими вопросами, я не в теме от слова совсем. Наугад —",
  "Я тебе что, справочник цен?! Ладно, чисто чтобы отстал —",
  "Опять двадцать пять... Без понятия если честно, но раз надо — пусть будет",
];

function showPhoneModal(){
  const round = currentRound();
  const opts = shuffledOptions(round);
  const availableIdx = opts.map((o,i)=>i).filter(i=>!state.removed.includes(i));
  const correctIdx = opts.findIndex(o=>o.isCorrect);
  let suggestIdx;
  const knowsIt = Math.random() < 0.7 && availableIdx.includes(correctIdx);
  if(knowsIt){ suggestIdx = correctIdx; }
  else{
    const wrongPool = availableIdx.filter(i=>i!==correctIdx);
    suggestIdx = wrongPool.length ? pick(wrongPool) : correctIdx;
  }
  const line = knowsIt ? pick(PHONE_LINES_RIGHT) : pick(PHONE_LINES_WRONG);
  const character = pick(PHONE_CHARACTERS);

  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.innerHTML = `
    <div class="modal">
      <div class="who">${character.emoji}</div>
      <h3>Звонок другу</h3>
      <div class="name">${character.name}</div>
      <div class="modal-speech">${line} <b>вариант ${LETTERS[suggestIdx]} (${fmtUnit(opts[suggestIdx].v)})</b>. И вообще, не звони мне больше по этому поводу 😤</div>
      <button class="loz-btn" id="closePhone">${loz("ЗАКРЫТЬ")}</button>
    </div>`;
  document.body.appendChild(modal);
  document.getElementById('closePhone').onclick = ()=> modal.remove();
}

function showAudienceModal(){
  const round = currentRound();
  const opts = shuffledOptions(round);
  const availableIdx = opts.map((o,i)=>i).filter(i=>!state.removed.includes(i));
  const correctIdx = opts.findIndex(o=>o.isCorrect);

  const weights = availableIdx.map(i=> i===correctIdx ? (40+Math.random()*30) : (5+Math.random()*25));
  const sum = weights.reduce((a,b)=>a+b,0);
  const pcts = weights.map(w=>Math.round(w/sum*100));
  pcts[0] += 100 - pcts.reduce((a,b)=>a+b,0);

  const barsHtml = availableIdx.map((idx,k)=>`
    <div class="bar">
      <div class="pct">${pcts[k]}%</div>
      <div class="col" id="bar-${k}" data-pct="${pcts[k]}"></div>
      <div class="l">${LETTERS[idx]}</div>
    </div>`).join("");

  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.innerHTML = `<div class="modal"><h3>Помощь зала</h3><div class="bars">${barsHtml}</div><button class="loz-btn" id="closeAud">${loz("ЗАКРЫТЬ")}</button></div>`;
  document.body.appendChild(modal);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    availableIdx.forEach((idx,k)=>{
      const el = document.getElementById('bar-'+k);
      if(el) el.style.height = (el.dataset.pct*1.2)+"px";
    });
  }));
  document.getElementById('closeAud').onclick = ()=> modal.remove();
}

function renderEnd(){
  const title = state.won ? "Идеально! 🏆" : (state.cashed ? "Вы забрали деньги" : "Игра окончена");
  const text = state.won ? "Вы точно разбираетесь в себестоимости — все 20 вопросов позади." : (state.cashed ? "Разумное решение — выигрыш зафиксирован." : "Не страшно — с опытом глаз наостряется на ткань и декор.");
  return `
  <div class="center">
    <div class="ring">${ringSVG(true)}</div>
    <div class="loz-row question">${loz(`<div><b>${title}</b></div><div class="sub">${text}</div>`)}</div>
    <div class="final-amount">${fmtAED(state.finalAmount)}</div>
    <button class="loz-btn primary" id="againBtn">${loz("ИГРАТЬ ЗАНОВО")}</button>
  </div>`;
}
function attachEnd(){
  document.getElementById('againBtn').onclick = ()=>{ state = {screen:"start"}; render(); };
}

render();
</script>
